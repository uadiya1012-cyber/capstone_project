{% load static %}

<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{% static 'css/pico.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <!-- <script src="{% static 'js/pico.min.js' %}"></script> -->
  </head>
  <body>
    {% include 'includes/navbar.html' %}

    <main>
      {% if messages %}
        <div class="messages-container" style="max-width: 1200px; margin: 20px auto; padding: 0 20px;">
          {% for message in messages %}
            <div class="alert {% if message.tags %}alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    <!-- Charts and app scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
  </body>
</html>
